project:
  name: "hello-fastapi"
  description: "Minimal FastAPI test app for golden-fleece e2e testing"
  language: "python"
  framework: "fastapi"

target:
  type: kind
  cluster_name: "hello-fastapi-dev"
  ports:
    - containerPort: 30800
      hostPort: 8080
      protocol: TCP

stacks:
  registry:
    enabled: true
    type: kind
    port: 5050

  observability:
    enabled: true
    type: lgtm

  gitops:
    enabled: false

  argo-workflows: false

app:
  start_cmd: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  health_url: "http://localhost:8000/healthz"
  port: 8000
  env_file: ".env.dev"

helm:
  chart_dir: "./chart"
  release_name: "hello-fastapi"
  namespace: "hello-fastapi"
  values_dev: "chart/values-dev.yaml"
